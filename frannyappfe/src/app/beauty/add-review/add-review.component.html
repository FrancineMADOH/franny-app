<main class="my-2 container">
    <h1 class="text-center">Review our Prestation</h1>
    <p class="text-center my-2" id="rateMe1">We look foward to hear from you to improve our service </p>
    <section>
        <h1 class="text-center">Hello {{values[0]}} </h1>
        <p class="text-center my-2">Your opinon on your prestation | 
            Date: <span class="attributes">{{date[0]}}</span> |
            Heure: <span class="attributes">{{date[1]}}</span> |
            doneby: <span class="attributes">  {{values[1]}}</span>  
        </p>
        <form  class="my-2" #addReviewForm="ngForm" (ngSubmit)="saveUserReview(addReviewForm)">
            <div class="form-group my-2">
                <label for="note">Your rating</label>
                <input class="form-control" placeholder="Rating is between 1 and 5" type="text" required name="note" id="name" ngModel #note="ngModel" maxlength="1"
                    pattern="[1-5]*">
                <small *ngIf="!note['valid'] && note['touched']">Rating is between 1 - 5</small>
            </div>
            <div class="form-group my-2">
                <label for="comment">Your Review</label>
                <textarea name="comment" id="comment" class="form-control" required maxlength="300" ngModel #comment="ngModel"
                    placeholder="300 characters max..."></textarea>
                <small *ngIf="!comment['valid'] && comment['touched']">Please add a valid review</small>
            </div>
            <button type="submit" [disabled]="!addReviewForm['valid']" class="btn btn-secondary">Add Review</button>
        </form>
        <p class="text-center" *ngIf="(isuser && isreview)" >Review Successfull. You can now close this window</p>
    
    </section>

</main>
