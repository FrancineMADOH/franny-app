<div class="row container-fluid">
    <div class="col-lg-12 m-2">
        <h1 class="text-center m-2">All appointments</h1>
        <button class="btn btn-success m-2" (click)="goToNewAppointmentPage()" >New Rendez-vous</button>
        <div class="searchFormClass col-lg-4">
            <form #searchRendezVous="ngForm" (ngSubmit)="searchArticleByTerm(searchRendezVous)" class="d-inline">
                <div class="form-group">
                    <input id="search" minlength="5" name="search" required ngModel #search="ngModel" placeholder="Search..."
                        type="text">
                    <button [disabled]="!searchRendezVous.valid" class="btn btn-success mx-2" type="submit">Search</button>
                </div>
            </form>
        </div>
    </div>
    <div class="col-lg-12">
        <app-rdv-card></app-rdv-card>
    </div>
</div>
