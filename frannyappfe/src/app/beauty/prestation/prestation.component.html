<div class="row container-fluid">
    <div class="col-lg-12 m-2">
        <h1 class="text-center m-2">All Prestations</h1>
        <button class="btn btn-success m-2" (click)="goToNewPrestation()" >Add Prestation</button>
        <div class="searchFormClass col-lg-4">
            <form #searchPrestation="ngForm" (ngSubmit)="searchPrestationByTerm(searchPrestation)" class="d-inline">
                <div class="form-group">
                    <input id="search" minlength="5" name="search" required ngModel #search="ngModel" placeholder="Search..."
                        type="text">
                    <button [disabled]="!searchPrestation.valid" class="btn btn-success mx-2" type="submit">Search</button>
                </div>
            </form>
        </div>
    </div>
    <div class="col-lg-12">
        <app-prestation-card></app-prestation-card>
    </div>
</div>
