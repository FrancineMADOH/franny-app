<div class="container">
    <form #addFaqForm (ngSubmit)="saveNewFaq(addFaqForm)" >
    <div class="form-group m-2">
        <label for="title">Faq Title</label>
        <input type="text" 
        ngModel
        #title="ngModel"
        value="" name="question" id="question" class="form-control" required>
        <small *ngIf="!title.valid && title.touched" style="color: red;" >Please provide a title for Faq</small>
      </div>
        <div class="form-group m-2">
        <label for="category">Category</label>
        <select class="form-select"
            id="category"
            name="category"
            ngModel
            required
            #category="ngModel">
          <option >Select category</option>
          <option value="">1</option>
        </select>
        <small *ngIf="!category.valid && category.touched" style="color: red;" >Please choose a category for faq</small>
      </div>
        <div class="form-group m-2">
        <label for="reponse">Answer</label>
        <textarea  
        ngModel
        #reponse="ngModel"
        name="reponse"  
        id="reponse" class="form-control" required></textarea>
        <small *ngIf="!reponse.valid && reponse.touched" style="color: red;" >Please a response for the FAQ</small>
      </div>
    <button type="submit" [disabled]="!addFaqForm['valid']" class="btn btn-success">Save faq</button>
    </form>
</div>
