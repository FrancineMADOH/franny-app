
<div class="container">
    <form #addRendezvousForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="form-group my-2">
            <label for="clientname">Votre nom</label>
            <input type="text"  class="form-control"
            name="clientname" 
            required
            maxlength="100"
            ngModel
            #clientname="ngModel"
            id="clientname">
            <small style="color:red;" *ngIf="!clientname.valid && clientname.touched">Please enter your name</small>
        </div>
        <div class="form-group">
            <label for="phone">Enter your phone number</label>
            <input type="text"
             id="phone"
             ngModel
             #phone="ngModel"
             maxlength="9"
             required
             placeholder="[0-9] -  max 9 characters"
            pattern="[0-9]*" name="phone" class="form-control">
            <small *ngIf="!phone.valid && phone.touched" style="color:red;">Please enter a valid phone number</small>
        </div>
        <div class="form-group my-2">
            <label for="email">Enter your Email address</label>
            <input class="form-control" 
            ngModel
            #email="ngModel"
            type="email" name="email" id="email">
            <small *ngIf="!email.valid && email.touched" style="color:red;">Invalid email</small>
        </div>
        <div class="form-group my-2">
            <label for="rdvdate">Choose a date for your appointement </label>
            <input  class="form-control" 
            ngModel
            required
            #rdvdate="ngModel"
            placeholder="choose a date"
            type="datetime-local" 
            name="rdvdate" id="rdv">
            <small *ngIf="!rdvdate.valid && rdvdate.touched"  style="color:red;">Please choose a date for your appointment</small>
        </div>

        <div class="form-group my-2">
            <label for="prestation">Choisissez une prestation</label>
            <select class="form-control" 
            ngModel
            #prestation="ngModel"
            required
            name="prestation" id="prestation">
                <option selected>Select  Prestation</option>
                <option *ngFor="let el of prestations" value="{{el.pres_id}}">{{el.title}} </option>
            </select>
            <small *ngIf="!prestation.valid && prestation.touched" style="color:red;">Please choose a prestation</small>
        </div>
        <div class="form-group my-2" *ngIf="!iscreateMode">
            <label for="state">Appointement state</label>
            <select class="form-control" 
             name="state" id="state">
                <option selected>State</option>
                <option *ngFor="let el of appointment_state" value="el">el</option>
            </select>
        </div>
        <div class="form-group my-2">
            <label for="rdvtype">Choose Appointment type</label>
            <select class="form-control" 
            required
            ngModel
            #rdvtype="ngModel"
            name="rdvtype" id="rdvtype">
                <option value="0" selected>Appointment type</option>
                <option *ngFor="let val of appointment_type" value="{{val}}">{{val}}</option>
            </select>
            <small *ngIf="!prestation.valid && prestation.touched" style="color:red;">Please choose a type for your prestation</small>
        </div>

        <div class="form-group my-2">
            <label for="category">Prestation category</label>
                <select class="form-control"
                required
                ngModel
                #category="ngModel" 
                name="category" id="category">
                <option value="">Choose Category</option>
                    <option *ngFor="let val of categories"  value="{{val}}">{{val}}</option>    
                </select>
            </div>
        <div class="form-group my-2">
        <label for="ptype">Type de Seance</label>
            <select class="form-control"
            required
            ngModel
            #ptype="ngModel" 
            name="ptype" id="ptype">
            <option value="">Choose Your prestation type</option>
                <option  value="classic">Classic</option>
                <option value="gold">Gold</option>
                <option value="premium">Premium</option>
            </select>
        </div>
        <small *ngIf="!ptype.valid && ptype.touched" >Choose the type of prestation you want</small>
        <div class="form-group my-2">
            <label for="ville">Choose your Town</label>
            <select class="form-control" 
            required
            ngModel
            #ville="ngModel"
            name="ville" id="ville">
                <option value="" selected>Town</option>
                <option *ngFor="let el of allVille" value="{{el.ville}} ">{{el.ville}} </option>
            </select>
            <small *ngIf="!ville.valid && ville.touched" style="color:red;">Please choose a town</small>
        </div>
        <div class="form-group my-2">
            <label for="quartier">Choose your Quartier</label>
            <select class="form-control"
            required
            ngModel
            #quartier="ngModel" 
            name="quartier" id="quartier">
                <option value="" selected>Quartier</option>
                <option *ngFor="let el of allLocation" value="el.quartier">{{el.quartier}}</option>
            </select>
            <small *ngIf="!quartier.valid && quartier.touched" style="color:red;">Please choose a your quartiier</small>
        </div>
        <div class="form-group my-2">
            <label for="comments">Commentaires</label>
            <textarea class="form-control"
            id="comments"
            ngModel
            #comments="ngModel"
            name="comments"></textarea>
        </div>
       
        <div class="form-group my-2">
            <label for="rdvcode">Appointement Code</label>
                <input type="text" 
                class="form-control"
                placeholder="codedu rendez-vous"
                readonly
                ngModel
                value="{{this.rdvcode}}"
                #rdvcode="ngModel"
                name="rdvcode" id="rdvcode">
        </div>  
        <button type="submit" [disabled]="!addRendezvousForm['valid']" class="btn btn-success m-3  ">Confirm</button> 
    </form>
    <button (click)="backToRdv()" class="btn btn-danger m-3">Cancel</button>
</div>
