<div class="col-lg-6 login-wrapper">
    <div class="login-header">
        <img src="" alt="logo franny">
        <h4> <span style="color:#F460FC;">Feminity</span> - <span style="color:#F460FC;">Maternity</span> - <span style="color:#F460FC">Family</span></h4>
        <h3 class="my-4"> Sign in to your account </h3>
    </div>

    <div class="login-form">
        <form method="" (ngSubmit)="loginUser()" #Form="ngForm">
            <div class="form-group my-4 mx-2">
              <input  type="email" class="form-control"  required minlength="6" name="email" id="email" [(ngModel)]="email" aria-describedby="emailHelp" placeholder="Enter your email">
            </div>
            <div class="form-group my-4 mx-2">
              <input type="password" class="form-control" required minlength="8" id="password" name="password" [(ngModel)]="password" placeholder="Enter your password">
            </div>
            <a routerLink="/dashboard"> <button type="submit" class="btn my-2 ">Sign in<fa-icon class="mx-2" [icon]="faArrowRight"  [styles]="{ stroke: '#fff', color: '#fff' }"></fa-icon> </button></a>
            //    
          </form>
    </div>

    <div class="login-footer">
        <p>Fogot password? <a routerLink="/reset">Reset here</a></p>
        <p>No account ? <a routerLink="/signup">Signup here</a></p>
    </div>
</div>
