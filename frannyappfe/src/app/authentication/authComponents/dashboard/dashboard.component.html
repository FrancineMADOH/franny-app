<main>
    <div class="row m-2">
        <!-- <div class="col-lg-10">  -->
        <div class="col-lg-2  profile" id="profile">
            <h4 class="my-4 text-center">Profile</h4>
            <h6> Welcome<span> {{ user.username }}</span> </h6>
            <div class="invisible_on_phone">
            <h6 class="m-3 text-center">Socials Links</h6>
            <ul class="social_links m-2">
                <li >  <a class="fa" [href]="'{{fcbk}}'" target="_blank" rel="noopener noreferrer"><i class="bi bi-facebook mx-2"></i></a> </li>
                <li >  <a class="fa" [href]="'{{twitter}}'" target="_blank" rel="noopener noreferrer"><i class="bi bi-twitter mx-2"></i></a> </li>
                <li >  <a class="fa" [href]="'{{linked}}'" target="_blank" rel="noopener noreferrer"><i class="bi bi-linkedin mx-2"></i></a> </li>
            </ul>
            </div>
            <p class="m-4">
                <strong>Update Profile ?</strong><br/>
                <button  (click)="logOut()" class="btn btn-primary ">Logout</button>
            </p>    
        </div>

        
        <div class="col-lg-4 blog_section">
            <h4 class="text-center my-2">Blog</h4>
            <ul class="blog m-4">
                <li><a routerLink="/posts/new" >New Post</a> </li>
                <li><a routerLink="/posts">All Blog Posts</a> </li>
                <li><a routerLink="/posts/statistics" >Statistics</a> </li>
                <li><a routerLink="/admin">Administration</a> </li>
            </ul>
        </div>
        <div class="col-lg-3 blog_section">
            <h4 class="text-center my-2">Beauty</h4>
            <ul class="beauty m-4">
                <li><a routerLink="/beauty/beautifyers">Beautifyers</a> </li>
                <li><a routerLink="/beauty/faqs">FAQS</a> </li>
                <li><a routerLink="/beauty/prestations">Prestations</a></li>
                <li><a routerLink="/beauty/rendezvous">Rendez-vous</a> </li>
                <li><a routerLink="/beauty/reviews">Reviews</a> </li>
                <li><a routerLink="/beauty/performance">Service Performance</a> </li>
            </ul>
        </div>
        <div class="col-lg-3 blog_section">
            <h4 class="text-center my-2">Market</h4>
            <ul class="market m-4">
                <li><a routerLink="/market/add">Add New article</a> </li>
                <li><a routerLink="/beauty/articless">All articles</a> </li>
                <li><a routerLink="/beauty/faqs">FAQS</a> </li>
            </ul>
        </div>

    </div>
</main>
