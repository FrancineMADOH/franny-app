<div class="container">
<div class="form-group m-3 p-2">
    <label for="title">Title</label>
    <input type="text" value="title" name="title" id="title" class="form-control" required>
    <label for="category">Category</label>
    <select class="form-select" name="category"  id="category">
      <option selected>Select category</option>
      <option value=""></option>
    </select>
    
    <label for="summary">Description</label>
    <textarea  name="summary"  id="summary" class="form-control" required></textarea>
    <label for="content">Content</label>
    <textarea  name="content" id="content" class="form-control" required></textarea>
    <label for="create_at">Date de creation</label>
    <input type="string"  class="form-control"  name="create_at" id="create_at" readonly  placeholder="{{create_at}}">
    <label for="author">Author</label>
    <input type="text" class="form-control" name="author" id="author" placeholder="Author">
     <div class="my-4">
        <label for="illustration">Add Illustration</label>
        <input type="file" name="illustration" value="" id="illustration">
     </div>
    
</div>

<a  routerLink="/posts" class="btn btn-secondary m-3">Cancel</a>
<button type="submit" class="btn btn-success m-3  ">Publish</button>
</div>
