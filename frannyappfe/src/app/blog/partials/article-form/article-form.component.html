<div class="container">

<form #addArticle="ngForm" enctype="multipart/form-data" (ngSubmit)="onSubmit()">
<div class="form-group my-2">
    <label for="title">Title</label>
    <input type="text" 
    ngModel
    maxlength="150"
    name="title" 
    id="title" 
    #title="ngModel"
    class="form-control" 
    required>
    <small *ngIf="!title.valid && title.touched ">Please provide a valid title </small>
  </div>
  <div class="form-group my-2">
    <label for="category">Category</label>
    <select 
    class="form-select"
     name="category"  
     ngModel
     required
     #category="ngModel"
     id="category">
      <option selected>Select category</option>
      <option *ngFor="let cat of categories" value="{{cat}}">{{cat}}</option>
    </select>
    <small *ngIf="!category.valid && category.touched">Please choose a category</small>
  </div> 
  <div class="form-group my-2">
    <label for="summary">Description</label>
    <textarea  
    name="summary"  
    id="summary" 
    ngModel
    #summary="ngModel"
    required
    maxlength="300"
    class="form-control" required></textarea>
    <small  *ngIf="summary.touched && !summary.valid">Please provide a valid title</small>
  </div>
  <div class="form-group my-2">
    <label for="content">Content (4000 characters...)</label>
    <textarea 
    ngModel
    #content="ngModel"
    maxlength="4000"
    name="content"
    id="content"
    class="form-control"
    required></textarea>
    <small  *ngIf="content.touched && !content.valid">Please provide a valid content</small>
  </div>
  <!-- <div class="form-group my-2">
    <label for="create_at">Date de creation</label>
    <input type="string"  class="form-control"  name="create_at" id="create_at" readonly  placeholder="{{create_at}}">
  </div> -->

    <label for="author">Author</label>
    <select class="form-select" 
    name="author"
    required
    ngModel
    #author="ngModel"
      id="author">
      <option selected>Select article authory</option>
      <option value=""></option>
    </select>
    <small *ngIf="!author.valid && author.touched">Please select the author</small>
  </div>  -->
    <div  class="my-4 form-group">
        <label for="illustration">Add Illustration</label>
        <input type="file" #illustration="ngModel" ngModel name="illustration"  id="illustration">
     </div>
     <button type="submit" (click)="viewPost()"  [disabled]="!addArticle.valid" class="btn btn-success m-3  ">Publish</button>
</form>
<button (click)="backToPosts()" class="btn btn-secondary m-3">Cancel</button>
</div>
