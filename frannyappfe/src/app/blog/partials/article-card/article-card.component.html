<div class="col-lg-12 m-2">
    <h1 class="text-center m-2">All articles</h1>
    <div class="searchFormClass col-lg-4">
        <form #searchForm="ngForm" (ngSubmit)="searchArticleByTerm(searchForm.value)" class="d-inline">
            <div class="form-group">
                <input id="search" minlength="5" name="search" required ngModel #search="ngModel" placeholder="Search..."
                    type="text">
                <button [disabled]="!searchForm.valid" class="btn btn-success mx-2" type="submit">Search</button>
            </div>
        </form>
    </div>
</div>
<div class="card m-2" *ngFor="let post of filteredPostList" >
    <div class="card-body">
        <h4 class="card-title">{{post.title}} </h4>
        <div class="card-subtitle text-muted">
            <span class="mx-2"> {{post.admin_name}} </span>
            <span class="mx-2">{{post.create_at}} </span>
            <span class="mx-2">{{post.category}} </span>
        </div>
        <div class="card-text p-2 my-3">
            {{post.summary}}
        </div>
        <div class="" >
            <ul>
                <li>
                    <a  href="{{post.facebook_url}}" target="_blank">social icon  </a>

                </li>
                <li>
                    <a href="{{post.linkedin_url}}" target="_blank">social icon  </a>

                </li>
                <li>
                    <a href="{{post.twitter_url}}" target="_blank">social icon  </a>

                </li>
            </ul>
        </div>
        <div class="card-action">
            <button (click)="viewblogPost(post.post_id||1,post.slug)"  class="btn btn-success mx-3 read">Read More</button>
            <button *ngIf="isAdmin" (click)="editblogPost(post.post_id || 1 )"  class="btn btn-secondary mx-2">Edit</button>
            <button *ngIf="isAdmin" (click)="deleteblogPost(post.post_id || 1)"  class="btn btn-danger" type="submit">Delete</button>
           

        </div>
    </div>

</div>
